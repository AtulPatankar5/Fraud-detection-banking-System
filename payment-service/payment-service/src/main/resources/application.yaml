spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/c_payment_service_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

#Razorpay config

razorpay:
  key-id: ${RAZORPAY_API_KEY}
  key-secret: ${RAZORPAY_API_SECRET}
  webhook-secret:

management:
  endpoints:
    web:
      exposure:
        include: health,info
